[common]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = time, send_on_enter
build_flags   =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:test_fingerprint]
extends          = common
build_src_filter = +<fingerprint/*>
lib_deps         = adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.0

[env:test_rfid]
extends          = common
build_src_filter = +<rfid/*>
lib_deps         =
    adafruit/Adafruit PN532
    adafruit/Adafruit BusIO
